<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        The Infinite Pond — Make the Ripple
    </title>


    <style>

        /* =====================================================
           GLOBAL
        ===================================================== */

        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            min-height: 100%;

            background:
                #02070d;

            color: white;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

        }


        body {

            overflow-x: hidden;

        }


        /* =====================================================
           WATER CANVAS
        ===================================================== */

        #waterCanvas {

            position: fixed;

            inset: 0;

            width: 100vw;
            height: 100vh;

            z-index: 0;

            display: block;

            pointer-events: none;

        }


        /* =====================================================
           PAGE CONTENT
        ===================================================== */

        .pond-page {

            position: relative;

            z-index: 2;

            min-height: 100vh;

            pointer-events: none;

        }


        /* =====================================================
           TOP NIGHT SKY
        ===================================================== */

        .night-sky {

            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 34vh;

            background:

                radial-gradient(
                    circle at 50% 20%,
                    rgba(170, 205, 225, 0.08),
                    transparent 28%
                ),

                linear-gradient(
                    to bottom,
                    rgba(1, 7, 14, 0.96),
                    rgba(2, 10, 18, 0.72),
                    rgba(2, 12, 20, 0)
                );

            pointer-events: none;

        }


        /* =====================================================
           STARS
        ===================================================== */

        .stars {

            position: absolute;

            inset: 0;

            width: 100%;
            height: 42vh;

            pointer-events: none;

        }


        .star {

            position: absolute;

            width: 2px;
            height: 2px;

            border-radius: 50%;

            background: rgba(
                220,
                240,
                255,
                0.8
            );

            box-shadow:
                0 0 5px rgba(
                    180,
                    220,
                    255,
                    0.55
                );

            animation:
                starPulse
                4s
                ease-in-out
                infinite;

        }


        .star:nth-child(1) {

            left: 8%;
            top: 12%;

        }

        .star:nth-child(2) {

            left: 17%;
            top: 23%;

            animation-delay: 1s;

        }

        .star:nth-child(3) {

            left: 28%;
            top: 9%;

            animation-delay: 2s;

        }

        .star:nth-child(4) {

            left: 39%;
            top: 17%;

            animation-delay: 0.5s;

        }

        .star:nth-child(5) {

            left: 62%;
            top: 11%;

            animation-delay: 1.7s;

        }

        .star:nth-child(6) {

            left: 73%;
            top: 25%;

            animation-delay: 2.5s;

        }

        .star:nth-child(7) {

            left: 84%;
            top: 13%;

            animation-delay: 0.8s;

        }

        .star:nth-child(8) {

            left: 92%;
            top: 30%;

            animation-delay: 1.4s;

        }


        @keyframes starPulse {

            0%,
            100% {

                opacity: 0.35;

                transform:
                    scale(0.8);

            }

            50% {

                opacity: 1;

                transform:
                    scale(1.35);

            }

        }


        /* =====================================================
           MAIN HEADER
        ===================================================== */

        .pond-header {

            position: relative;

            width: min(
                900px,
                90vw
            );

            margin: 0 auto;

            padding-top: 8vh;

            text-align: center;

            pointer-events: none;

        }


        .presented {

            margin-bottom: 8px;

            font-size:
                clamp(
                    0.75rem,
                    1.5vw,
                    1rem
                );

            letter-spacing:
                0.28em;

            text-transform:
                uppercase;

            color:
                rgba(
                    220,
                    240,
                    250,
                    0.65
                );

        }


        .pond-title {

            margin: 0;

            font-size:
                clamp(
                    2rem,
                    6vw,
                    4.5rem
                );

            font-weight:
                300;

            letter-spacing:
                0.12em;

            text-transform:
                uppercase;

            color:
                rgba(
                    235,
                    248,
                    255,
                    0.94
                );

            text-shadow:

                0 0 12px
                rgba(
                    130,
                    205,
                    255,
                    0.22
                ),

                0 0 35px
                rgba(
                    80,
                    170,
                    220,
                    0.16
                );

        }


        .pond-subtitle {

            margin-top: 12px;

            font-size:
                clamp(
                    0.75rem,
                    1.5vw,
                    1rem
                );

            letter-spacing:
                0.18em;

            text-transform:
                uppercase;

            color:
                rgba(
                    210,
                    235,
                    245,
                    0.58
                );

        }


        /* =====================================================
           INTERACTION PROMPT
        ===================================================== */

        .interaction-cue {

            position: fixed;

            left: 50%;

            bottom: 42px;

            transform:
                translateX(-50%);

            z-index: 5;

            padding:
                9px
                18px;

            border-radius:
                999px;

            background:
                rgba(
                    2,
                    12,
                    20,
                    0.48
                );

            border:
                1px solid
                rgba(
                    180,
                    225,
                    245,
                    0.12
                );

            color:
                rgba(
                    220,
                    240,
                    250,
                    0.58
                );

            font-size:
                0.75rem;

            letter-spacing:
                0.08em;

            backdrop-filter:
                blur(8px);

            -webkit-backdrop-filter:
                blur(8px);

            pointer-events: none;

        }


        /* =====================================================
           MAKE A RIPPLE BUTTON
        ===================================================== */

        .make-ripple-button {

            position: fixed;

            right: 24px;

            bottom: 24px;

            z-index: 20;

            display: flex;

            align-items: center;

            gap: 9px;

            padding:
                12px
                17px;

            border-radius:
                999px;

            border:
                1px solid
                rgba(
                    175,
                    225,
                    245,
                    0.28
                );

            background:
                rgba(
                    3,
                    18,
                    29,
                    0.72
                );

            color:
                rgba(
                    235,
                    249,
                    255,
                    0.92
                );

            font-family:
                inherit;

            font-size:
                0.78rem;

            font-weight:
                600;

            letter-spacing:
                0.09em;

            text-transform:
                uppercase;

            cursor:
                pointer;

            box-shadow:

                0 5px 24px
                rgba(
                    0,
                    0,
                    0,
                    0.35
                ),

                0 0 18px
                rgba(
                    70,
                    170,
                    220,
                    0.08
                );

            backdrop-filter:
                blur(10px);

            -webkit-backdrop-filter:
                blur(10px);

            transition:

                transform
                0.25s
                ease,

                background
                0.25s
                ease,

                border-color
                0.25s
                ease,

                box-shadow
                0.25s
                ease;

            pointer-events:
                auto;

        }


        .make-ripple-button:hover {

            transform:
                translateY(-2px);

            background:
                rgba(
                    8,
                    34,
                    49,
                    0.86
                );

            border-color:
                rgba(
                    185,
                    235,
                    255,
                    0.52
                );

            box-shadow:

                0 8px 30px
                rgba(
                    0,
                    0,
                    0,
                    0.42
                ),

                0 0 24px
                rgba(
                    90,
                    190,
                    235,
                    0.18
                );

        }


        .make-ripple-button:active {

            transform:
                translateY(0)
                scale(0.97);

        }


        /* =====================================================
           BUTTON RIPPLE ICON
        ===================================================== */

        .ripple-icon {

            position: relative;

            width: 17px;
            height: 17px;

            display: inline-block;

        }


        .ripple-icon::before,
        .ripple-icon::after {

            content: "";

            position: absolute;

            left: 50%;
            top: 50%;

            border:
                1px solid
                rgba(
                    210,
                    240,
                    255,
                    0.78
                );

            border-radius:
                50%;

            transform:
                translate(
                    -50%,
                    -50%
                );

        }


        .ripple-icon::before {

            width: 6px;
            height: 6px;

        }


        .ripple-icon::after {

            width: 15px;
            height: 9px;

            border-left-color:
                transparent;

            border-right-color:
                transparent;

            border-bottom-color:
                rgba(
                    210,
                    240,
                    255,
                    0.42
                );

        }


        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (
            max-width: 600px
        ) {

            .pond-header {

                padding-top:
                    10vh;

            }


            .interaction-cue {

                bottom:
                    88px;

                font-size:
                    0.68rem;

                padding:
                    8px
                    14px;

            }


            .make-ripple-button {

                right:
                    16px;

                bottom:
                    18px;

                padding:
                    11px
                    14px;

                font-size:
                    0.7rem;

            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         WATER
    ====================================================== -->

    <canvas
        id="waterCanvas"
    ></canvas>


    <!-- =====================================================
         PAGE
    ====================================================== -->

    <main
        class="pond-page"
    >

        <div
            class="night-sky"
        ></div>


        <div
            class="stars"
            aria-hidden="true"
        >

            <span class="star"></span>
            <span class="star"></span>
            <span class="star"></span>
            <span class="star"></span>
            <span class="star"></span>
            <span class="star"></span>
            <span class="star"></span>
            <span class="star"></span>

        </div>


        <!-- =================================================
             HEADER
        ================================================== -->

        <header
            class="pond-header"
        >

            <div
                class="presented"
            >
                Presents
            </div>


            <h1
                class="pond-title"
            >
                The Infinite Pond
            </h1>


            <div
                class="pond-subtitle"
            >
                Every ripple begins somewhere
            </div>

        </header>

    </main>


    <!-- =====================================================
         INTERACTION CUE
    ====================================================== -->

    <div
        class="interaction-cue"
    >
        Click anywhere on the pond to make a ripple
    </div>


    <!-- =====================================================
         MAKE A RIPPLE BUTTON
    ====================================================== -->

    <button
        id="makeRippleButton"
        class="make-ripple-button"
        type="button"
        aria-label="Make a Ripple"
    >

        <span
            class="ripple-icon"
            aria-hidden="true"
        ></span>

        <span>
            Make a Ripple
        </span>

    </button>


    <!-- =====================================================
         WATER ENGINE
    ====================================================== -->

    <script
        src="water.js"
    ></script>


    <!-- =====================================================
         MAKE A RIPPLE BUTTON
         
         Submission workflow will be connected here
         in a later 10.4B step.
    ====================================================== -->

    <script>

        const makeRippleButton =
            document.getElementById(
                "makeRippleButton"
            );


        if (
            makeRippleButton
        ) {

            makeRippleButton.addEventListener(
                "click",
                function () {

                    console.log(
                        "Make a Ripple button clicked."
                    );

                }
            );

        }

    </script>


</body>

</html>
