<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>The Infinite Pond | Make the Ripple</title>


<style>

/* =========================================================
   BASIC PAGE
========================================================= */

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {

    margin: 0;

    background: #063f4b;

    color: white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    overflow-x: hidden;
}


/* =========================================================
   HEADER
========================================================= */

.header {

    position: fixed;

    top: 0;
    left: 0;

    width: 100%;

    z-index: 1000;

    text-align: center;

    padding: 28px 20px 22px;

    background:
        linear-gradient(
            rgba(2,25,32,0.90),
            rgba(2,25,32,0.28)
        );

    backdrop-filter:
        blur(8px);

    -webkit-backdrop-filter:
        blur(8px);

    border-bottom:
        1px solid
        rgba(255,255,255,0.08);

    transition:
        opacity 0.6s ease,
        transform 0.6s ease;
}

.header.hidden {

    opacity: 0;

    transform:
        translateY(-100%);
}

.logo {

    font-size: 13px;

    letter-spacing: 5px;

    text-transform: uppercase;

    opacity: 0.75;
}

h1 {

    margin:
        7px 0 5px;

    font-size:
        clamp(32px, 6vw, 68px);

    font-weight: 500;

    letter-spacing: 1px;

    text-shadow:
        0 3px 15px
        rgba(0,0,0,0.45);
}

.subtitle {

    font-size: 17px;

    opacity: 0.78;

    font-style: italic;
}

.ripple-count {

    margin-top: 13px;

    font-size: 12px;

    letter-spacing: 3px;

    opacity: 0.6;
}


/* =========================================================
   INFINITE POND
========================================================= */

.pond {

    position: relative;

    min-height: 12000px;

    overflow: hidden;

    background:
        #063f4b;
}


/* =========================================================
   WATER TEXTURE SYSTEM
========================================================= */

.water-layer {

    position: absolute;

    top: -15%;

    left: -15%;

    width: 130%;

    height: 130%;

    background-image:
        url("water-texture.jpg");

    background-repeat:
        repeat;

    background-size:
        700px 700px;

    background-position:
        center center;

    pointer-events:
        none;
}


/* First water layer */

.water-layer.one {

    z-index: 1;

    opacity: 0.92;

    filter:
        saturate(1.15)
        contrast(1.05);

    animation:
        waterDriftOne
        75s
        linear
        infinite;
}


/* Second water layer */

.water-layer.two {

    z-index: 2;

    opacity: 0.38;

    background-size:
        950px 950px;

    mix-blend-mode:
        soft-light;

    animation:
        waterDriftTwo
        105s
        linear
        infinite;
}


/* Third water layer */

.water-layer.three {

    z-index: 3;

    opacity: 0.22;

    background-size:
        1200px 1200px;

    mix-blend-mode:
        screen;

    animation:
        waterDriftThree
        140s
        linear
        infinite;
}


/* =========================================================
   WATER MOVEMENT
========================================================= */

@keyframes waterDriftOne {

    0% {

        transform:
            translate3d(
                -2%,
                -2%,
                0
            );
    }

    50% {

        transform:
            translate3d(
                2%,
                1%,
                0
            );
    }

    100% {

        transform:
            translate3d(
                -2%,
                -2%,
                0
            );
    }
}


@keyframes waterDriftTwo {

    0% {

        transform:
            translate3d(
                3%,
                -2%,
                0
            )
            rotate(0.2deg);
    }

    50% {

        transform:
            translate3d(
                -2%,
                3%,
                0
            )
            rotate(-0.2deg);
    }

    100% {

        transform:
            translate3d(
                3%,
                -2%,
                0
            )
            rotate(0.2deg);
    }
}


@keyframes waterDriftThree {

    0% {

        transform:
            translate3d(
                -3%,
                2%,
                0
            );
    }

    50% {

        transform:
            translate3d(
                2%,
                -3%,
                0
            );
    }

    100% {

        transform:
            translate3d(
                -3%,
                2%,
                0
            );
    }
}


/* =========================================================
   WATER LIGHT
========================================================= */

.water-light {

    position: absolute;

    inset: 0;

    z-index: 4;

    pointer-events:
        none;

    background:

        radial-gradient(
            ellipse at 20% 15%,
            rgba(190,245,245,0.18),
            transparent 28%
        ),

        radial-gradient(
            ellipse at 80% 40%,
            rgba(120,220,225,0.12),
            transparent 32%
        ),

        radial-gradient(
            ellipse at 35% 90%,
            rgba(0,35,45,0.28),
            transparent 42%
        );

    mix-blend-mode:
        screen;

    opacity:
        0.65;

    animation:
        lightMovement
        28s
        ease-in-out
        infinite
        alternate;
}


@keyframes lightMovement {

    0% {

        transform:
            translate(
                -2%,
                -1%
            )
            scale(1);
    }

    100% {

        transform:
            translate(
                2%,
                2%
            )
            scale(1.05);
    }
}


/* =========================================================
   WATER SHIMMER
========================================================= */

.water-shimmer {

    position: absolute;

    inset: 0;

    z-index: 5;

    pointer-events:
        none;

    opacity:
        0.12;

    background:

        repeating-linear-gradient(
            110deg,
            transparent 0px,
            transparent 80px,
            rgba(220,255,255,0.12) 82px,
            transparent 86px,
            transparent 150px
        );

    background-size:
        350px 350px;

    animation:
        shimmerMove
        50s
        linear
        infinite;

    mix-blend-mode:
        overlay;
}


@keyframes shimmerMove {

    from {

        transform:
            translateX(-5%);
    }

    to {

        transform:
            translateX(5%);
    }
}


/* =========================================================
   DARK EDGE / DEPTH
========================================================= */

.water-depth {

    position: absolute;

    inset: 0;

    z-index: 6;

    pointer-events:
        none;

    background:

        radial-gradient(
            ellipse at center,
            transparent 45%,
            rgba(0,25,32,0.15) 70%,
            rgba(0,18,25,0.45) 100%
        );
}


/* =========================================================
   RIPPLE
========================================================= */

.ripple {

    position: absolute;

    width: 105px;

    height: 105px;

    border-radius: 50%;

    z-index: 20;

    cursor: pointer;

    transform:
        translate(-50%, -50%);

    transition:
        transform 0.5s ease;

    background:

        radial-gradient(
            circle,
            transparent 0,
            transparent 18px,

            rgba(230,255,255,0.25)
            19px,

            transparent 22px,

            transparent 31px,

            rgba(230,255,255,0.20)
            32px,

            transparent 35px
        );

    filter:
        drop-shadow(
            0 4px 8px
            rgba(0,0,0,0.18)
        );
}


.ripple::before {

    content: "";

    position: absolute;

    inset: 0;

    border-radius: 50%;

    border:
        2px solid
        rgba(230,255,255,0.55);

    box-shadow:
        0 0 8px
        rgba(220,255,255,0.18);
}


.ripple::after {

    content: "";

    position: absolute;

    inset: 17px;

    border-radius: 50%;

    border:
        2px solid
        rgba(230,255,255,0.38);
}


.ripple-dot {

    position: absolute;

    width: 7px;

    height: 7px;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background:
        rgba(235,255,255,0.75);

    box-shadow:
        0 0 10px
        rgba(220,255,255,0.45);
}


.ripple:hover {

    transform:
        translate(-50%, -50%)
        scale(1.45);

    z-index: 100;

    filter:
        drop-shadow(
            0 8px 18px
            rgba(0,0,0,0.25)
        );
}


/* =========================================================
   MESSAGE
========================================================= */

.message-overlay {

    position: fixed;

    inset: 0;

    z-index: 2000;

    background:
        rgba(0,15,20,0.42);

    backdrop-filter:
        blur(4px);

    -webkit-backdrop-filter:
        blur(4px);

    opacity: 0;

    pointer-events:
        none;

    transition:
        opacity 0.35s ease;
}


.message-overlay.active {

    opacity: 1;

    pointer-events:
        auto;
}


.message {

    position: fixed;

    left: 50%;
    top: 50%;

    width:
        min(90%, 520px);

    padding:
        40px 35px;

    transform:
        translate(-50%, -50%)
        scale(0.90);

    background:

        linear-gradient(
            145deg,
            rgba(7,61,72,0.98),
            rgba(2,37,46,0.98)
        );

    border:
        1px solid
        rgba(255,255,255,0.16);

    border-radius:
        24px;

    box-shadow:
        0 30px 100px
        rgba(0,0,0,0.60);

    text-align:
        center;

    opacity:
        0;

    transition:
        transform 0.35s ease,
        opacity 0.35s ease;
}


.message-overlay.active
.message {

    opacity: 1;

    transform:
        translate(-50%, -50%)
        scale(1);
}


.message-number {

    font-size:
        11px;

    letter-spacing:
        4px;

    opacity:
        0.55;

    margin-bottom:
        25px;
}


.message-text {

    font-size:
        22px;

    line-height:
        1.6;

    font-style:
        italic;

    margin-bottom:
        25px;
}


.message-location {

    font-size:
        13px;

    opacity:
        0.55;
}


.close {

    margin-top:
        28px;

    padding:
        11px 28px;

    border:
        1px solid
        rgba(255,255,255,0.35);

    background:
        transparent;

    color:
        white;

    border-radius:
        30px;

    cursor:
        pointer;
}


.close:hover {

    background:
        rgba(255,255,255,0.10);
}


/* =========================================================
   MAKE YOUR RIPPLE
========================================================= */

.make-ripple {

    position: fixed;

    right: 25px;

    bottom: 25px;

    z-index: 1500;

    padding:
        15px 25px;

    border: none;

    border-radius:
        50px;

    background:
        rgba(255,255,255,0.95);

    color:
        #06414c;

    font-weight:
        bold;

    cursor:
        pointer;

    box-shadow:
        0 10px 35px
        rgba(0,0,0,0.30);

    transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
}


.make-ripple:hover {

    transform:
        translateY(-4px);

    box-shadow:
        0 14px 40px
        rgba(0,0,0,0.38);
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px) {

    .header {

        padding:
            20px 15px;
    }

    .logo {

        font-size:
            10px;

        letter-spacing:
            3px;
    }

    h1 {

        font-size:
            34px;
    }

    .subtitle {

        font-size:
            14px;
    }

    .ripple {

        width:
            75px;

        height:
            75px;
    }

    .message {

        padding:
            30px 24px;
    }

    .message-text {

        font-size:
            19px;
    }

    .make-ripple {

        right:
            15px;

        bottom:
            15px;

        padding:
            13px 20px;
    }

}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="header"
        id="header">

    <div class="logo">
        MAKE THE RIPPLE
    </div>

    <h1>
        The Infinite Pond
    </h1>

    <div class="subtitle">
        Every ripple starts with one person.
    </div>

    <div class="ripple-count">
        🌊 100 RIPPLE MAKERS
    </div>

</header>


<!-- =====================================================
     POND
===================================================== -->

<main class="pond"
      id="pond">

    <div class="water-layer one">
    </div>

    <div class="water-layer two">
    </div>

    <div class="water-layer three">
    </div>

    <div class="water-light">
    </div>

    <div class="water-shimmer">
    </div>

    <div class="water-depth">
    </div>

</main>


<!-- =====================================================
     MESSAGE OVERLAY
===================================================== -->

<div class="message-overlay"
     id="messageOverlay">

    <div class="message">

        <div class="message-number"
             id="messageNumber">
        </div>

        <div class="message-text"
             id="messageText">
        </div>

        <div class="message-location"
             id="messageLocation">
        </div>

        <button class="close"
                onclick="closeMessage()">

            Close Ripple

        </button>

    </div>

</div>


<!-- =====================================================
     MAKE YOUR RIPPLE
===================================================== -->

<button class="make-ripple"
        onclick="makeRipple()">

    🌊 Make Your Ripple

</button>


<script>


/* =========================================================
   RIPPLE DATA
========================================================= */

const messages = [

    {
        text:
        "Today I checked in on someone who seemed like they needed someone to talk to.",

        location:
        "Kitchener, Ontario"
    },

    {
        text:
        "Asking for help doesn't make you weak.",

        location:
        "Waterloo, Ontario"
    },

    {
        text:
        "Today I chose kindness.",

        location:
        "Cambridge, Ontario"
    },

    {
        text:
        "I reminded someone that they aren't alone.",

        location:
        "Guelph, Ontario"
    },

    {
        text:
        "Today I took a moment to look after myself.",

        location:
        "Toronto, Ontario"
    },

    {
        text:
        "Sometimes the smallest act of kindness can make the biggest difference.",

        location:
        "Hamilton, Ontario"
    },

    {
        text:
        "I asked someone how they were really doing.",

        location:
        "London, Ontario"
    },

    {
        text:
        "Today I decided that reaching out was worth it.",

        location:
        "Ottawa, Ontario"
    },

    {
        text:
        "You never know what someone is carrying. Be kind.",

        location:
        "Windsor, Ontario"
    },

    {
        text:
        "I don't have to solve everything. Sometimes listening is enough.",

        location:
        "Kingston, Ontario"
    }

];


/* =========================================================
   CREATE RIPPLES
========================================================= */

const pond =
    document.getElementById("pond");

let rippleNumber = 0;


function createRipple() {

    rippleNumber++;

    const ripple =
        document.createElement("div");

    ripple.className =
        "ripple";


    const dot =
        document.createElement("div");

    dot.className =
        "ripple-dot";


    ripple.appendChild(
        dot
    );


    const data =
        messages[
            Math.floor(
                Math.random()
                *
                messages.length
            )
        ];


    ripple.dataset.text =
        data.text;

    ripple.dataset.location =
        data.location;

    ripple.dataset.number =
        rippleNumber;


    ripple.style.left =
        (
            5 +
            Math.random() * 90
        )
        + "%";


    ripple.style.top =
        (
            150 +
            Math.random() * 11700
        )
        + "px";


    ripple.addEventListener(
        "click",
        function(event) {

            event.stopPropagation();

            showMessage(
                ripple.dataset.number,
                ripple.dataset.text,
                ripple.dataset.location
            );

        }
    );


    pond.appendChild(
        ripple
    );

}


/* =========================================================
   INITIAL RIPPLE FIELD
========================================================= */

for (
    let i = 0;
    i < 120;
    i++
) {

    createRipple();

}


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(
    number,
    text,
    location
) {

    document.getElementById(
        "messageNumber"
    ).innerText =
        "RIPPLE #" + number;


    document.getElementById(
        "messageText"
    ).innerText =
        '"' +
        text +
        '"';


    document.getElementById(
        "messageLocation"
    ).innerText =
        "— " +
        location;


    document.getElementById(
        "messageOverlay"
    ).classList.add(
        "active"
    );

}


function closeMessage() {

    document.getElementById(
        "messageOverlay"
    ).classList.remove(
        "active"
    );

}


/* =========================================================
   CLICK OUTSIDE MESSAGE
========================================================= */

document
    .getElementById("messageOverlay")
    .addEventListener(
        "click",
        function(event) {

            if (
                event.target === this
            ) {

                closeMessage();

            }

        }
    );


/* =========================================================
   MAKE YOUR RIPPLE
========================================================= */

function makeRipple() {

    alert(
        "Your Ripple submission form will be connected here next."
    );

}


/* =========================================================
   HEADER FADE
========================================================= */

let lastScroll =
    window.scrollY;


window.addEventListener(
    "scroll",
    function() {

        const currentScroll =
            window.scrollY;


        const header =
            document.getElementById(
                "header"
            );


        if (
            currentScroll > 500 &&
            currentScroll > lastScroll
        ) {

            header.classList.add(
                "hidden"
            );

        }

        else {

            header.classList.remove(
                "hidden"
            );

        }


        lastScroll =
            currentScroll;

    }
);

</script>


</body>

</html>
