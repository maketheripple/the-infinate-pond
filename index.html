<script>

    let interactionCueTimer;

    let hasMadeFirstRipple = false;

    let firstRippleMessageTimer;


    function closeMessage() {

        const message =
            document.querySelector(
                ".message"
            );

        if (message) {

            message.style.display =
                "none";

        }

    }


    function showInteractionCue() {

        const cue =
            document.getElementById(
                "interactionCue"
            );

        if (cue) {

            cue.classList.remove(
                "hidden"
            );

        }

    }


    function hideInteractionCue() {

        const cue =
            document.getElementById(
                "interactionCue"
            );

        if (cue) {

            cue.classList.add(
                "hidden"
            );

        }


        clearTimeout(
            interactionCueTimer
        );


        interactionCueTimer =
            setTimeout(
                showInteractionCue,
                5000
            );

    }


    function showFirstRippleMessage() {

        if (
            hasMadeFirstRipple
        ) {

            return;

        }


        hasMadeFirstRipple =
            true;


        const message =
            document.getElementById(
                "firstRippleMessage"
            );

        if (!message) {

            return;

        }


        clearTimeout(
            firstRippleMessageTimer
        );


        message.classList.remove(
            "hide"
        );


        message.classList.add(
            "show"
        );


        firstRippleMessageTimer =
            setTimeout(
                function() {

                    message.classList.remove(
                        "show"
                    );

                    message.classList.add(
                        "hide"
                    );

                },
                4500
            );

    }


    function makeRipple() {

        const x =
            window.innerWidth / 2;

        const y =
            window.innerHeight / 2;

        if (
            typeof createRipple ===
            "function"
        ) {

            createRipple(
                x,
                y
            );

            hideInteractionCue();

            showFirstRippleMessage();

        }

    }


    document.addEventListener(
        "pointerdown",
        function(event) {

            if (
                event.target.closest(
                    ".make-ripple, .message, button"
                )
            ) {

                return;

            }


            if (
                typeof createRipple ===
                "function"
            ) {

                hideInteractionCue();

                showFirstRippleMessage();

            }

        }
    );

</script>
