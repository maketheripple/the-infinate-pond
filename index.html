<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>The Infinite Pond | Make the Ripple</title>

    <style>

        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #000;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

        }


        body {

            position: relative;

            color: white;

        }


        #waterCanvas {

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            display: block;

            z-index: 0;

        }


        .moonGlow {

            position: fixed;

            top: 12%;
            left: 50%;

            width: 180px;
            height: 180px;

            transform:
                translateX(-50%);

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(210, 235, 255, 0.20) 0%,
                    rgba(170, 215, 255, 0.08) 35%,
                    rgba(100, 160, 220, 0.02) 60%,
                    transparent 75%
                );

            pointer-events: none;

            z-index: 1;

        }


        .logo {

            position: fixed;

            top: 30px;
            left: 40px;

            z-index: 5;

            font-size: 20px;

            font-weight: bold;

            letter-spacing: 3px;

        }


        h1 {

            position: fixed;

            top: 42%;
            left: 50%;

            transform:
                translate(
                    -50%,
                    -50%
                );

            z-index: 5;

            margin: 0;

            font-size: clamp(
                36px,
                7vw,
                90px
            );

            text-align: center;

            font-weight: 300;

            letter-spacing: 4px;

            pointer-events: none;

        }


        .subtitle {

            position: fixed;

            top: calc(42% + 65px);
            left: 50%;

            transform:
                translateX(-50%);

            z-index: 5;

            text-align: center;

            font-size: 18px;

            opacity: 0.8;

            pointer-events: none;

        }


        .ripple-count {

            position: fixed;

            top: 30px;
            right: 40px;

            z-index: 5;

            font-size: 15px;

            letter-spacing: 1px;

            opacity: 0.85;

        }


        .message {

            position: fixed;

            left: 50%;
            bottom: 40px;

            transform:
                translateX(-50%);

            z-index: 10;

            width: min(
                90%,
                500px
            );

            padding: 25px;

            box-sizing: border-box;

            text-align: center;

            border-radius: 16px;

            background:
                rgba(
                    0,
                    15,
                    30,
                    0.82
                );

            border:
                1px solid
                rgba(
                    180,
                    220,
                    255,
                    0.25
                );

            backdrop-filter:
                blur(10px);

            display: none;

        }


        .message-number {

            font-size: 14px;

            opacity: 0.6;

            margin-bottom: 10px;

        }


        .message-text {

            font-size: 22px;

            line-height: 1.4;

            margin-bottom: 10px;

        }


        .message-location {

            font-size: 14px;

            opacity: 0.65;

            margin-bottom: 20px;

        }


        .close {

            padding:
                10px
                20px;

            border: none;

            border-radius: 20px;

            cursor: pointer;

            background: rgba(
                255,
                255,
                255,
                0.15
            );

            color: white;

        }


        .close:hover {

            background: rgba(
                255,
                255,
                255,
                0.25
            );

        }


        .make-ripple {

            position: fixed;

            bottom: 25px;
            right: 30px;

            z-index: 5;

            padding:
                12px
                20px;

            border-radius: 25px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.10
                );

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.20
                );

            color: white;

            font-size: 15px;

            cursor: pointer;

        }


        .make-ripple:hover {

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.20
                );

        }

    </style>

</head>


<body>


    <div class="logo">
        MAKE THE RIPPLE
    </div>


    <h1>
        The Infinite Pond
    </h1>


    <div class="subtitle">
        Every ripple starts with one person.
    </div>


    <div class="ripple-count">
        🌊 100 RIPPLE MAKERS
    </div>


    <canvas id="waterCanvas"></canvas>


    <div class="moonGlow"></div>


    <div class="message">

        <div
            class="message-number"
            id="messageNumber">
        </div>


        <div
            class="message-text"
            id="messageText">
        </div>


        <div
            class="message-location"
            id="messageLocation">
        </div>


        <button
            class="close"
            onclick="closeMessage()">

            Close Ripple

        </button>

    </div>


    <button
        class="make-ripple"
        onclick="makeRipple()">

        🌊 Make Your Ripple

    </button>


    <script src="water.js"></script>


    <script>

        function closeMessage() {

            const message =
                document.querySelector(
                    ".message"
                );

            if (message) {

                message.style.display =
                    "none";

            }

        }


        function makeRipple() {

            const x =
                window.innerWidth / 2;

            const y =
                window.innerHeight / 2;

            if (
                typeof createRipple ===
                "function"
            ) {

                createRipple(
                    x,
                    y
                );

            }

        }

    </script>


</body>

</html>
