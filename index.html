<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
    The Infinite Pond — Make the Ripple
</title>


<style>

/* =====================================================
   GLOBAL
===================================================== */

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    min-height: 100%;

    background:
        #02070d;

    color: white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

}


body {

    overflow-x: hidden;

}


/* =====================================================
   WATER CANVAS
===================================================== */

#waterCanvas {

    position: fixed;

    inset: 0;

    width: 100vw;
    height: 100vh;

    z-index: 0;

    display: block;

    pointer-events: none;

}


/* =====================================================
   PAGE CONTENT
===================================================== */

.pond-page {

    position: relative;

    z-index: 2;

    min-height: 160vh;

    pointer-events: none;

}


/* =====================================================
   TOP NIGHT SKY
===================================================== */

.night-sky {

    position: fixed;

    top: 0;
    left: 0;

    width: 100%;
    height: 42vh;

    background:

        radial-gradient(
            circle at 50% 20%,
            rgba(170, 205, 225, 0.08),
            transparent 28%
        ),

        linear-gradient(
            to bottom,
            rgba(1, 7, 14, 0.96),
            rgba(2, 10, 18, 0.72),
            rgba(2, 12, 20, 0)
        );

    pointer-events: none;

    z-index: 1;

}


/* =====================================================
   STARS
===================================================== */

.stars {

    position: fixed;

    top: 0;
    left: 0;

    width: 100%;
    height: 42vh;

    pointer-events: none;

    z-index: 3;

}


.star {

    position: absolute;

    width: 2px;
    height: 2px;

    border-radius: 50%;

    background:
        rgba(
            220,
            240,
            255,
            0.8
        );

    box-shadow:

        0 0 5px
        rgba(
            180,
            220,
            255,
            0.55
        );

    animation:
        starPulse
        4s
        ease-in-out
        infinite;

}


.star:nth-child(1) {

    left: 8%;
    top: 12%;

}


.star:nth-child(2) {

    left: 17%;
    top: 23%;

    animation-delay:
        1s;

}


.star:nth-child(3) {

    left: 28%;
    top: 9%;

    animation-delay:
        2s;

}


.star:nth-child(4) {

    left: 39%;
    top: 17%;

    animation-delay:
        0.5s;

}


.star:nth-child(5) {

    left: 62%;
    top: 11%;

    animation-delay:
        1.7s;

}


.star:nth-child(6) {

    left: 73%;
    top: 25%;

    animation-delay:
        2.5s;

}


.star:nth-child(7) {

    left: 84%;
    top: 13%;

    animation-delay:
        0.8s;

}


.star:nth-child(8) {

    left: 92%;
    top: 30%;

    animation-delay:
        1.4s;

}


@keyframes starPulse {

    0%,
    100% {

        opacity:
            0.35;

        transform:
            scale(0.8);

    }

    50% {

        opacity:
            1;

        transform:
            scale(1.35);

    }

}


/* =====================================================
   HORIZON LINE
===================================================== */

.horizon {

    position: fixed;

    left: 0;

    top: 45vh;

    width: 100%;

    height: 2px;

    z-index: 6;

    pointer-events: none;

    background:

        linear-gradient(
            to right,

            transparent 0%,

            rgba(
                170,
                220,
                240,
                0.04
            ) 8%,

            rgba(
                180,
                225,
                245,
                0.28
            ) 25%,

            rgba(
                210,
                240,
                255,
                0.38
            ) 50%,

            rgba(
                180,
                225,
                245,
                0.28
            ) 75%,

            rgba(
                170,
                220,
                240,
                0.04
            ) 92%,

            transparent 100%
        );

    box-shadow:

        0 0 7px
        rgba(
            160,
            215,
            240,
            0.18
        ),

        0 0 25px
        rgba(
            120,
            195,
            225,
            0.12
        );

}


/* =====================================================
   HORIZON FOG
===================================================== */

.horizon::before {

    content: "";

    position: absolute;

    left: 0;

    top: -32px;

    width: 100%;

    height: 65px;

    background:

        radial-gradient(
            ellipse at center,

            rgba(
                155,
                210,
                235,
                0.075
            ),

            rgba(
                90,
                160,
                195,
                0.025
            ) 38%,

            transparent 72%
        );

    filter:
        blur(8px);

}


/* =====================================================
   MAIN HEADER
===================================================== */

.pond-header {

    position: fixed;

    top: 0;
    left: 50%;

    transform:
        translateX(-50%);

    width: min(
        900px,
        90vw
    );

    height: 41vh;

    display: flex;

    flex-direction:
        column;

    align-items:
        center;

    justify-content:
        flex-start;

    text-align:
        center;

    pointer-events:
        none;

    z-index:
        7;

}


/* =====================================================
   MAKE THE RIPPLE LOGO

   LOCKED IN CURRENT POSITION
===================================================== */

.pond-logo {

    width:
        clamp(
            210px,
            30vw,
            340px
        );

    height:
        auto;

    margin-top:
        2.5vh;

    margin-bottom:
        0.8vh;

    opacity:
        0.96;

    filter:

        drop-shadow(
            0 0 16px
            rgba(
                120,
                205,
                235,
                0.42
            )
        )

        drop-shadow(
            0 0 48px
            rgba(
                100,
                190,
                225,
                0.34
            )
        )

        drop-shadow(
            0 0 90px
            rgba(
                100,
                190,
                225,
                0.22
            )
        );

}


/* =====================================================
   HEADER WORDING GROUP

   MOVES INDEPENDENTLY FROM THE LOGO

   This allows the logo to remain locked in place
   while all wording below it moves together.
===================================================== */

.pond-header-text {

    display:
        flex;

    flex-direction:
        column;

    align-items:
        center;

    width:
        100%;

    margin-top:
        2.8vh;

}


/* =====================================================
   PRESENTED
===================================================== */

.presented {

    margin-bottom:
        5px;

    font-size:
        clamp(
            0.7rem,
            1.35vw,
            0.95rem
        );

    letter-spacing:
        0.28em;

    text-transform:
        uppercase;

    color:
        rgba(
            220,
            240,
            250,
            0.68
        );

}


/* =====================================================
   MAIN TITLE
===================================================== */

.pond-title {

    margin:
        0;

    font-size:
        clamp(
            1.9rem,
            5.5vw,
            4.2rem
        );

    font-weight:
        300;

    letter-spacing:
        0.12em;

    text-transform:
        uppercase;

    color:
        rgba(
            235,
            248,
            255,
            0.95
        );

    text-shadow:

        0 0 12px
        rgba(
            130,
            205,
            255,
            0.28
        ),

        0 0 35px
        rgba(
            80,
            170,
            220,
            0.22
        ),

        0 0 70px
        rgba(
            80,
            170,
            220,
            0.12
        );

}


/* =====================================================
   SUBTITLE
===================================================== */

.pond-subtitle {

    margin-top:
        10px;

    font-size:
        clamp(
            0.7rem,
            1.35vw,
            0.95rem
        );

    letter-spacing:
        0.18em;

    text-transform:
        uppercase;

    color:
        rgba(
            210,
            235,
            245,
            0.62
        );

    text-shadow:

        0 0 12px
        rgba(
            110,
            195,
            225,
            0.15
        );

}


/* =====================================================
   INTERACTION PROMPT
===================================================== */

.interaction-cue {

    position: fixed;

    left: 50%;

    bottom:
        42px;

    transform:
        translateX(-50%);

    z-index:
        10;

    padding:
        9px
        18px;

    border-radius:
        999px;

    background:
        rgba(
            2,
            12,
            20,
            0.48
        );

    border:
        1px solid
        rgba(
            180,
            225,
            245,
            0.12
        );

    color:
        rgba(
            220,
            240,
            250,
            0.58
        );

    font-size:
        0.75rem;

    letter-spacing:
        0.08em;

    backdrop-filter:
        blur(8px);

    -webkit-backdrop-filter:
        blur(8px);

    pointer-events:
        none;

}


/* =====================================================
   MAKE A RIPPLE BUTTON
===================================================== */

.make-ripple-button {

    position: fixed;

    right:
        24px;

    bottom:
        24px;

    z-index:
        20;

    display:
        flex;

    align-items:
        center;

    gap:
        9px;

    padding:
        12px
        17px;

    border-radius:
        999px;

    border:
        1px solid
        rgba(
            175,
            225,
            245,
            0.28
        );

    background:
        rgba(
            3,
            18,
            29,
            0.72
        );

    color:
        rgba(
            235,
            249,
            255,
            0.92
        );

    font-family:
        inherit;

    font-size:
        0.78rem;

    font-weight:
        600;

    letter-spacing:
        0.09em;

    text-transform:
        uppercase;

    cursor:
        pointer;

    box-shadow:

        0 5px 24px
        rgba(
            0,
            0,
            0,
            0.35
        ),

        0 0 18px
        rgba(
            70,
            170,
            220,
            0.08
        );

    backdrop-filter:
        blur(10px);

    -webkit-backdrop-filter:
        blur(10px);

    transition:

        transform
        0.25s
        ease,

        background
        0.25s
        ease,

        border-color
        0.25s
        ease,

        box-shadow
        0.25s
        ease;

    pointer-events:
        auto;

}


.make-ripple-button:hover {

    transform:
        translateY(-2px);

    background:
        rgba(
            8,
            34,
            49,
            0.86
        );

    border-color:
        rgba(
            185,
            235,
            255,
            0.52
        );

    box-shadow:

        0 8px 30px
        rgba(
            0,
            0,
            0,
            0.42
        ),

        0 0 24px
        rgba(
            90,
            190,
            235,
            0.18
        );

}


.make-ripple-button:active {

    transform:
        translateY(0)
        scale(0.97);

}


/* =====================================================
   BUTTON RIPPLE ICON
===================================================== */

.ripple-icon {

    position:
        relative;

    width:
        17px;

    height:
        17px;

    display:
        inline-block;

}


.ripple-icon::before,
.ripple-icon::after {

    content:
        "";

    position:
        absolute;

    left:
        50%;

    top:
        50%;

    border:
        1px solid
        rgba(
            210,
            240,
            255,
            0.78
        );

    border-radius:
        50%;

    transform:
        translate(
            -50%,
            -50%
        );

}


.ripple-icon::before {

    width:
        6px;

    height:
        6px;

}


.ripple-icon::after {

    width:
        15px;

    height:
        9px;

    border-left-color:
        transparent;

    border-right-color:
        transparent;

    border-bottom-color:
        rgba(
            210,
            240,
            255,
            0.42
        );

}


/* =====================================================
   RESPONSIVE
===================================================== */

@media (
    max-width: 600px
) {

    .pond-logo {

        width:
            210px;

        margin-top:
            3vh;

    }


    .pond-header-text {

        margin-top:
            2.4vh;

    }


    .pond-title {

        font-size:
            clamp(
                1.55rem,
                8vw,
                2.7rem
            );

    }


    .pond-subtitle {

        font-size:
            0.66rem;

        letter-spacing:
            0.14em;

    }


    .interaction-cue {

        bottom:
            88px;

        font-size:
            0.68rem;

        padding:
            8px
            14px;

    }


    .make-ripple-button {

        right:
            16px;

        bottom:
            18px;

        padding:
            11px
            14px;

        font-size:
            0.7rem;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     WATER
====================================================== -->

<canvas
    id="waterCanvas"
></canvas>


<!-- =====================================================
     NIGHT SKY
====================================================== -->

<div
    class="night-sky"
></div>


<!-- =====================================================
     STARS
====================================================== -->

<div
    class="stars"
    aria-hidden="true"
>

    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>

</div>


<!-- =====================================================
     HORIZON
====================================================== -->

<div
    class="horizon"
    aria-hidden="true"
></div>


<!-- =====================================================
     PAGE
====================================================== -->

<main
    class="pond-page"
>


    <!-- =================================================
         HEADER
    ================================================== -->

    <header
        class="pond-header"
    >


        <!-- =============================================
             MAKE THE RIPPLE LOGO

             LOCKED POSITION
        ============================================== -->

        <img
            class="pond-logo"
            src="images/Make the Ripple Large Logo.png"
            alt="Make the Ripple"
        >


        <!-- =============================================
             HEADER WORDING GROUP

             MOVES TOGETHER INDEPENDENTLY FROM LOGO
        ============================================== -->

        <div
            class="pond-header-text"
        >


            <!-- =========================================
                 PRESENTS
            ========================================== -->

            <div
                class="presented"
            >
                Presents
            </div>


            <!-- =========================================
                 TITLE
            ========================================== -->

            <h1
                class="pond-title"
            >
                The Infinite Pond
            </h1>


            <!-- =========================================
                 SUBTITLE
            ========================================== -->

            <div
                class="pond-subtitle"
            >
                Every Ripple Begins Somewhere
            </div>


        </div>


    </header>


</main>


<!-- =====================================================
     INTERACTION CUE
====================================================== -->

<div
    class="interaction-cue"
>
    Click anywhere on the pond to make a ripple
</div>


<!-- =====================================================
     MAKE A RIPPLE BUTTON
====================================================== -->

<button
    id="makeRippleButton"
    class="make-ripple-button"
    type="button"
    aria-label="Make a Ripple"
>

    <span
        class="ripple-icon"
        aria-hidden="true"
    ></span>

    <span>
        Make a Ripple
    </span>

</button>


<!-- =====================================================
     WATER ENGINE
====================================================== -->

<script
    src="water.js"
></script>


<!-- =====================================================
     MAKE A RIPPLE BUTTON
     
     Submission workflow will be connected here
     in a later version.
====================================================== -->

<script>

    const makeRippleButton =
        document.getElementById(
            "makeRippleButton"
        );


    if (
        makeRippleButton
    ) {

        makeRippleButton.addEventListener(
            "click",
            function () {

                console.log(
                    "Make a Ripple button clicked."
                );

            }
        );

    }

</script>


</body>

</html>
