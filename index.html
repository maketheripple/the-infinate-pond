<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>The Infinite Pond | Make the Ripple</title>


<style>

/* =========================================================
   BASIC PAGE
========================================================= */

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {

    margin: 0;

    background: #010914;

    color: white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    overflow-x: hidden;
}


/* =========================================================
   HEADER
========================================================= */

.header {

    position: fixed;

    top: 0;
    left: 0;

    width: 100%;

    z-index: 1000;

    text-align: center;

    padding: 28px 20px 22px;

    background:
        linear-gradient(
            rgba(1,8,17,0.92),
            rgba(1,8,17,0.20)
        );

    backdrop-filter:
        blur(8px);

    -webkit-backdrop-filter:
        blur(8px);

    border-bottom:
        1px solid
        rgba(180,220,255,0.08);

    transition:
        opacity 0.6s ease,
        transform 0.6s ease;
}

.header.hidden {

    opacity: 0;

    transform:
        translateY(-100%);
}


.logo {

    font-size: 13px;

    letter-spacing: 5px;

    text-transform: uppercase;

    opacity: 0.70;
}


h1 {

    margin:
        7px 0 5px;

    font-size:
        clamp(32px, 6vw, 68px);

    font-weight:
        500;

    letter-spacing:
        1px;

    text-shadow:
        0 3px 20px
        rgba(0,0,0,0.9);
}


.subtitle {

    font-size:
        17px;

    opacity:
        0.70;

    font-style:
        italic;
}


.ripple-count {

    margin-top:
        13px;

    font-size:
        12px;

    letter-spacing:
        3px;

    opacity:
        0.55;
}


/* =========================================================
   POND
========================================================= */

.pond {

    position:
        relative;

    width:
        100%;

    height:
        12000px;

    overflow:
        hidden;

    background:
        #010914;
}


/* =========================================================
   WATER CANVAS
========================================================= */

#waterCanvas {

    position:
        absolute;

    top:
        0;

    left:
        0;

    width:
        100%;

    height:
        100%;

    z-index:
        1;

    display:
        block;
}


/* =========================================================
   MOONLIGHT ATMOSPHERE
========================================================= */

.moonGlow {

    position:
        absolute;

    top:
        0;

    left:
        50%;

    width:
        800px;

    height:
        800px;

    transform:
        translateX(-50%);

    z-index:
        2;

    pointer-events:
        none;

    background:
        radial-gradient(
            circle,
            rgba(210,235,255,0.14),
            rgba(100,160,210,0.04) 35%,
            transparent 70%
        );

    filter:
        blur(12px);
}





/* =========================================================
   RIPPLE
========================================================= */

.ripple {

    position:
        absolute;

    width:
        105px;

    height:
        105px;

    border-radius:
        50%;

    z-index:
        20;

    cursor:
        pointer;

    transform:
        translate(
            -50%,
            -50%
        );

    transition:
        transform
        0.5s ease;

    filter:

        drop-shadow(
            0 0 5px
            rgba(150,210,255,0.55)
        )

        drop-shadow(
            0 0 18px
            rgba(90,175,255,0.28)
        );
}


.ripple::before {

    content:
        "";

    position:
        absolute;

    inset:
        0;

    border-radius:
        50%;

    border:
        2px solid
        rgba(225,245,255,0.72);

    box-shadow:

        0 0 5px
        rgba(220,245,255,0.65),

        0 0 18px
        rgba(100,190,255,0.38),

        inset 0 0 8px
        rgba(200,235,255,0.18);
}


.ripple::after {

    content:
        "";

    position:
        absolute;

    inset:
        17px;

    border-radius:
        50%;

    border:
        2px solid
        rgba(215,238,255,0.42);
}


.ripple-dot {

    position:
        absolute;

    width:
        7px;

    height:
        7px;

    left:
        50%;

    top:
        50%;

    transform:
        translate(
            -50%,
            -50%
        );

    border-radius:
        50%;

    background:
        rgba(240,250,255,0.95);

    box-shadow:

        0 0 5px
        rgba(240,250,255,1),

        0 0 15px
        rgba(150,215,255,0.85),

        0 0 30px
        rgba(90,175,255,0.45);
}


.ripple:hover {

    transform:
        translate(
            -50%,
            -50%
        )
        scale(1.45);
}


/* =========================================================
   MESSAGE
========================================================= */

.message-overlay {

    position:
        fixed;

    inset:
        0;

    z-index:
        2000;

    background:
        rgba(0,5,12,0.55);

    backdrop-filter:
        blur(5px);

    -webkit-backdrop-filter:
        blur(5px);

    opacity:
        0;

    pointer-events:
        none;

    transition:
        opacity 0.35s ease;
}


.message-overlay.active {

    opacity:
        1;

    pointer-events:
        auto;
}


.message {

    position:
        fixed;

    left:
        50%;

    top:
        50%;

    width:
        min(90%, 520px);

    padding:
        40px 35px;

    transform:
        translate(
            -50%,
            -50%
        )
        scale(0.90);

    background:

        linear-gradient(
            145deg,
            rgba(7,35,53,0.98),
            rgba(2,18,30,0.98)
        );

    border:
        1px solid
        rgba(200,230,255,0.15);

    border-radius:
        24px;

    box-shadow:
        0 30px 100px
        rgba(0,0,0,0.75);

    text-align:
        center;

    opacity:
        0;

    transition:
        transform 0.35s ease,
        opacity 0.35s ease;
}


.message-overlay.active
.message {

    opacity:
        1;

    transform:
        translate(
            -50%,
            -50%
        )
        scale(1);
}


.message-number {

    font-size:
        11px;

    letter-spacing:
        4px;

    opacity:
        0.55;

    margin-bottom:
        25px;
}


.message-text {

    font-size:
        22px;

    line-height:
        1.6;

    font-style:
        italic;

    margin-bottom:
        25px;
}


.message-location {

    font-size:
        13px;

    opacity:
        0.55;
}


.close {

    margin-top:
        28px;

    padding:
        11px 28px;

    border:
        1px solid
        rgba(215,235,255,0.35);

    background:
        transparent;

    color:
        white;

    border-radius:
        30px;

    cursor:
        pointer;
}


.close:hover {

    background:
        rgba(200,230,255,0.10);
}


/* =========================================================
   MAKE YOUR RIPPLE
========================================================= */

.make-ripple {

    position:
        fixed;

    right:
        25px;

    bottom:
        25px;

    z-index:
        1500;

    padding:
        15px 25px;

    border:
        none;

    border-radius:
        50px;

    background:
        rgba(225,240,255,0.96);

    color:
        #06253a;

    font-weight:
        bold;

    cursor:
        pointer;

    box-shadow:
        0 10px 35px
        rgba(0,0,0,0.45);

    transition:
        transform 0.2s ease;
}


.make-ripple:hover {

    transform:
        translateY(-4px);
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px) {

    .header {

        padding:
            20px 15px;
    }

    .logo {

        font-size:
            10px;

        letter-spacing:
            3px;
    }

    h1 {

        font-size:
            34px;
    }

    .subtitle {

        font-size:
            14px;
    }

    .ripple {

        width:
            75px;

        height:
            75px;
    }

    .message {

        padding:
            30px 24px;
    }

    .message-text {

        font-size:
            19px;
    }

    .make-ripple {

        right:
            15px;

        bottom:
            15px;

        padding:
            13px 20px;
    }

}

</style>

</head>


<body>


<header class="header"
        id="header">

    <div class="logo">
        MAKE THE RIPPLE
    </div>

    <h1>
        The Infinite Pond
    </h1>

    <div class="subtitle">
        Every ripple starts with one person.
    </div>

    <div class="ripple-count">
        🌊 100 RIPPLE MAKERS
    </div>

</header>


<main class="pond"
      id="pond">


    <canvas id="waterCanvas">
    </canvas>


    <div class="moonGlow">
    </div>


    

</main>


<div class="message-overlay"
     id="messageOverlay">


    <div class="message">


        <div class="message-number"
             id="messageNumber">
        </div>


        <div class="message-text"
             id="messageText">
        </div>


        <div class="message-location"
             id="messageLocation">
        </div>


        <button class="close"
                onclick="closeMessage()">

            Close Ripple

        </button>


    </div>

</div>


<button class="make-ripple"
        onclick="makeRipple()">

    🌊 Make Your Ripple

</button>


<script>

/* =========================================================
   PROCEDURAL WATER
========================================================= */

const canvas =
    document.getElementById(
        "waterCanvas"
    );

const ctx =
    canvas.getContext(
        "2d"
    );


let width;
let height;

let waves = [];

const waveCount = 110;


/* =========================================================
   RESIZE
========================================================= */

function resizeCanvas() {

    width =
        canvas.width =
        window.innerWidth;

    height =
        canvas.height =
        document.getElementById(
            "pond"
        ).offsetHeight;

}


window.addEventListener(
    "resize",
    resizeCanvas
);

resizeCanvas();


/* =========================================================
   CREATE WATER WAVES
========================================================= */

for (
    let i = 0;
    i < waveCount;
    i++
) {

    waves.push({

        y:
            Math.random()
            * height,

        amplitude:
            2 +
            Math.random() * 8,

        wavelength:
            100 +
            Math.random() * 280,

        speed:
            0.15 +
            Math.random() * 0.35,

        phase:
            Math.random()
            * Math.PI
            * 2,

        opacity:
            0.03 +
            Math.random() * 0.08

    });

}


/* =========================================================
   DRAW WATER
========================================================= */

let time = 0;


function drawWater() {

    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    /* Deep water */

    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            height
        );


    gradient.addColorStop(
        0,
        "#071c30"
    );

    gradient.addColorStop(
        0.35,
        "#041625"
    );

    gradient.addColorStop(
        0.70,
        "#02111d"
    );

    gradient.addColorStop(
        1,
        "#010912"
    );


    ctx.fillStyle =
        gradient;


    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    /* Individual waves */

    for (
        let i = 0;
        i < waves.length;
        i++
    ) {

        const wave =
            waves[i];


        ctx.beginPath();


        for (
            let x = -50;
            x < width + 50;
            x += 8
        ) {

            const y =
                wave.y
                +
                Math.sin(
                    (
                        x /
                        wave.wavelength
                    )
                    +
                    wave.phase
                    +
                    time
                    * wave.speed
                )
                *
                wave.amplitude;


            if (
                x === -50
            ) {

                ctx.moveTo(
                    x,
                    y
                );

            }

            else {

                ctx.lineTo(
                    x,
                    y
                );

            }

        }


        ctx.strokeStyle =
            `rgba(
                150,
                205,
                235,
                ${wave.opacity}
            )`;


        ctx.lineWidth =
            0.6 +
            Math.random()
            * 0.8;


        ctx.stroke();

    }


    /* Moon reflection */

    const reflection =
        ctx.createRadialGradient(
            width / 2,
            height * 0.05,
            10,
            width / 2,
            height * 0.05,
            600
        );


    reflection.addColorStop(
        0,
        "rgba(220,240,255,0.13)"
    );

    reflection.addColorStop(
        0.25,
        "rgba(150,200,240,0.06)"
    );

    reflection.addColorStop(
        1,
        "rgba(80,140,190,0)"
    );


    ctx.fillStyle =
        reflection;


    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    time +=
        0.008;


    requestAnimationFrame(
        drawWater
    );

}


drawWater();


/* =========================================================
   RIPPLE DATA
========================================================= */

const messages = [

    {
        text:
        "Today I checked in on someone who seemed like they needed someone to talk to.",

        location:
        "Kitchener, Ontario"
    },

    {
        text:
        "Asking for help doesn't make you weak.",

        location:
        "Waterloo, Ontario"
    },

    {
        text:
        "Today I chose kindness.",

        location:
        "Cambridge, Ontario"
    },

    {
        text:
        "I reminded someone that they aren't alone.",

        location:
        "Guelph, Ontario"
    },

    {
        text:
        "Today I took a moment to look after myself.",

        location:
        "Toronto, Ontario"
    },

    {
        text:
        "Sometimes the smallest act of kindness can make the biggest difference.",

        location:
        "Hamilton, Ontario"
    },

    {
        text:
        "I asked someone how they were really doing.",

        location:
        "London, Ontario"
    },

    {
        text:
        "Today I decided that reaching out was worth it.",

        location:
        "Ottawa, Ontario"
    },

    {
        text:
        "You never know what someone is carrying. Be kind.",

        location:
        "Windsor, Ontario"
    },

    {
        text:
        "I don't have to solve everything. Sometimes listening is enough.",

        location:
        "Kingston, Ontario"
    }

];


const pond =
    document.getElementById(
        "pond"
    );

let rippleNumber = 0;


/* =========================================================
   CREATE RIPPLE
========================================================= */

function createRipple() {

    rippleNumber++;


    const ripple =
        document.createElement(
            "div"
        );


    ripple.className =
        "ripple";


    const dot =
        document.createElement(
            "div"
        );


    dot.className =
        "ripple-dot";


    ripple.appendChild(
        dot
    );


    const data =
        messages[
            Math.floor(
                Math.random()
                *
                messages.length
            )
        ];


    ripple.dataset.text =
        data.text;


    ripple.dataset.location =
        data.location;


    ripple.dataset.number =
        rippleNumber;


    ripple.style.left =
        (
            5 +
            Math.random() * 90
        )
        + "%";


    ripple.style.top =
        (
            150 +
            Math.random() * 11700
        )
        + "px";


    ripple.addEventListener(
        "click",
        function(event) {

            event.stopPropagation();


            showMessage(

                ripple.dataset.number,

                ripple.dataset.text,

                ripple.dataset.location

            );

        }
    );


    pond.appendChild(
        ripple
    );

}


/* =========================================================
   INITIAL RIPPLE FIELD
========================================================= */

for (
    let i = 0;
    i < 120;
    i++
) {

    createRipple();

}


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(
    number,
    text,
    location
) {

    document.getElementById(
        "messageNumber"
    ).innerText =
        "RIPPLE #" +
        number;


    document.getElementById(
        "messageText"
    ).innerText =
        '"' +
        text +
        '"';


    document.getElementById(
        "messageLocation"
    ).innerText =
        "— " +
        location;


    document.getElementById(
        "messageOverlay"
    ).classList.add(
        "active"
    );

}


function closeMessage() {

    document.getElementById(
        "messageOverlay"
    ).classList.remove(
        "active"
    );

}


/* =========================================================
   CLOSE MESSAGE
========================================================= */

document
    .getElementById(
        "messageOverlay"
    )
    .addEventListener(
        "click",
        function(event) {

            if (
                event.target === this
            ) {

                closeMessage();

            }

        }
    );


/* =========================================================
   MAKE YOUR RIPPLE
========================================================= */

function makeRipple() {

    alert(
        "Your Ripple submission form will be connected here next."
    );

}


/* =========================================================
   HEADER BEHAVIOUR
========================================================= */

let lastScroll =
    window.scrollY;


window.addEventListener(
    "scroll",
    function() {

        const currentScroll =
            window.scrollY;


        const header =
            document.getElementById(
                "header"
            );


        if (
            currentScroll > 500 &&
            currentScroll > lastScroll
        ) {

            header.classList.add(
                "hidden"
            );

        }

        else {

            header.classList.remove(
                "hidden"
            );

        }


        lastScroll =
            currentScroll;

    }
);

</script>


</body>

</html>
