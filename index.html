<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>The Infinite Pond | Make the Ripple</title>


<style>

/* =========================================================
   BASIC PAGE
========================================================= */

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {

    margin: 0;

    background: #020d18;

    color: white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    overflow-x: hidden;
}


/* =========================================================
   HEADER
========================================================= */

.header {

    position: fixed;

    top: 0;
    left: 0;

    width: 100%;

    z-index: 1000;

    text-align: center;

    padding: 28px 20px 22px;

    background:
        linear-gradient(
            rgba(1,9,18,0.94),
            rgba(1,12,22,0.35)
        );

    backdrop-filter:
        blur(10px);

    -webkit-backdrop-filter:
        blur(10px);

    border-bottom:
        1px solid
        rgba(180,220,255,0.08);

    transition:
        opacity 0.6s ease,
        transform 0.6s ease;
}


.header.hidden {

    opacity: 0;

    transform:
        translateY(-100%);
}


.logo {

    font-size: 13px;

    letter-spacing: 5px;

    text-transform: uppercase;

    color:
        rgba(220,240,255,0.72);
}


h1 {

    margin:
        7px 0 5px;

    font-size:
        clamp(32px, 6vw, 68px);

    font-weight:
        500;

    letter-spacing:
        1px;

    text-shadow:
        0 3px 20px
        rgba(0,0,0,0.8);
}


.subtitle {

    font-size:
        17px;

    opacity:
        0.72;

    font-style:
        italic;
}


.ripple-count {

    margin-top:
        13px;

    font-size:
        12px;

    letter-spacing:
        3px;

    opacity:
        0.55;
}


/* =========================================================
   POND
========================================================= */

.pond {

    position:
        relative;

    min-height:
        12000px;

    overflow:
        hidden;

    background:
        linear-gradient(
            180deg,
            #061a2b 0%,
            #041827 25%,
            #031421 50%,
            #02111c 75%,
            #010c16 100%
        );
}


/* =========================================================
   MOONLIGHT GLOW
========================================================= */

.moon-glow {

    position:
        absolute;

    top:
        4%;

    left:
        50%;

    width:
        700px;

    height:
        700px;

    transform:
        translateX(-50%);

    border-radius:
        50%;

    pointer-events:
        none;

    z-index:
        2;

    background:
        radial-gradient(
            circle,
            rgba(210,235,255,0.16) 0%,
            rgba(150,200,240,0.07) 28%,
            rgba(80,140,190,0.025) 50%,
            transparent 72%
        );

    filter:
        blur(8px);

    opacity:
        0.8;

    animation:
        moonBreath
        12s
        ease-in-out
        infinite
        alternate;
}


@keyframes moonBreath {

    from {

        opacity:
            0.65;

        transform:
            translateX(-50%)
            scale(0.98);
    }

    to {

        opacity:
            0.9;

        transform:
            translateX(-50%)
            scale(1.04);
    }
}


/* =========================================================
   MOONLIGHT REFLECTION
========================================================= */

.moon-reflection {

    position:
        absolute;

    top:
        0;

    left:
        50%;

    width:
        320px;

    height:
        100%;

    transform:
        translateX(-50%);

    z-index:
        3;

    pointer-events:
        none;

    opacity:
        0.32;

    background:

        repeating-linear-gradient(
            172deg,

            transparent 0px,

            transparent 32px,

            rgba(205,230,255,0.12) 36px,

            rgba(230,245,255,0.28) 39px,

            rgba(205,230,255,0.10) 43px,

            transparent 48px,

            transparent 75px
        );

    filter:
        blur(3px);

    animation:
        reflectionMove
        17s
        ease-in-out
        infinite
        alternate;
}


@keyframes reflectionMove {

    0% {

        transform:
            translateX(-50%)
            translateY(-2%)
            scaleX(0.90);
    }

    50% {

        transform:
            translateX(-50%)
            translateY(1%)
            scaleX(1.12);
    }

    100% {

        transform:
            translateX(-50%)
            translateY(3%)
            scaleX(0.95);
    }
}


/* =========================================================
   SUBTLE WATER WAVES
========================================================= */

.water-waves {

    position:
        absolute;

    inset:
        -100px;

    z-index:
        4;

    pointer-events:
        none;

    opacity:
        0.17;

    background:

        repeating-radial-gradient(
            ellipse at center,

            transparent 0px,

            transparent 45px,

            rgba(150,205,235,0.14) 48px,

            transparent 52px
        );

    background-size:
        800px 800px;

    animation:
        waveDrift
        55s
        linear
        infinite;

    mix-blend-mode:
        screen;
}


@keyframes waveDrift {

    from {

        transform:
            translate(
                -3%,
                -2%
            )
            scale(1);
    }

    to {

        transform:
            translate(
                3%,
                2%
            )
            scale(1.08);
    }
}


/* =========================================================
   MOVING WATER LINES
========================================================= */

.water-lines {

    position:
        absolute;

    inset:
        0;

    z-index:
        5;

    pointer-events:
        none;

    opacity:
        0.13;

    background:

        repeating-linear-gradient(
            177deg,

            transparent 0px,

            transparent 19px,

            rgba(180,220,245,0.12) 21px,

            transparent 24px,

            transparent 55px
        );

    background-size:
        100% 320px;

    animation:
        linesMove
        38s
        linear
        infinite;
}


@keyframes linesMove {

    from {

        background-position:
            0 0;
    }

    to {

        background-position:
            140px 500px;
    }
}


/* =========================================================
   DEPTH
========================================================= */

.water-depth {

    position:
        absolute;

    inset:
        0;

    z-index:
        6;

    pointer-events:
        none;

    background:

        radial-gradient(
            ellipse at center,

            transparent 20%,

            rgba(0,8,16,0.08) 55%,

            rgba(0,5,12,0.42) 100%
        );
}


/* =========================================================
   RIPPLE
========================================================= */

.ripple {

    position:
        absolute;

    width:
        105px;

    height:
        105px;

    border-radius:
        50%;

    z-index:
        20;

    cursor:
        pointer;

    transform:
        translate(
            -50%,
            -50%
        );

    transition:
        transform 0.5s ease;

    background:

        radial-gradient(
            circle,

            transparent 0,

            transparent 18px,

            rgba(210,235,255,0.20) 19px,

            transparent 22px,

            transparent 31px,

            rgba(210,235,255,0.17) 32px,

            transparent 35px
        );

    filter:
        drop-shadow(
            0 0 8px
            rgba(150,205,255,0.18)
        );
}


.ripple::before {

    content:
        "";

    position:
        absolute;

    inset:
        0;

    border-radius:
        50%;

    border:
        2px solid
        rgba(215,238,255,0.50);

    box-shadow:
        0 0 12px
        rgba(150,205,255,0.15);
}


.ripple::after {

    content:
        "";

    position:
        absolute;

    inset:
        17px;

    border-radius:
        50%;

    border:
        2px solid
        rgba(215,238,255,0.34);
}


.ripple-dot {

    position:
        absolute;

    width:
        7px;

    height:
        7px;

    left:
        50%;

    top:
        50%;

    transform:
        translate(
            -50%,
            -50%
        );

    border-radius:
        50%;

    background:
        rgba(225,242,255,0.75);

    box-shadow:
        0 0 12px
        rgba(180,220,255,0.45);
}


.ripple:hover {

    transform:
        translate(
            -50%,
            -50%
        )
        scale(1.45);

    z-index:
        100;

    filter:
        drop-shadow(
            0 0 18px
            rgba(170,215,255,0.35)
        );
}


/* =========================================================
   MESSAGE
========================================================= */

.message-overlay {

    position:
        fixed;

    inset:
        0;

    z-index:
        2000;

    background:
        rgba(0,5,12,0.52);

    backdrop-filter:
        blur(5px);

    -webkit-backdrop-filter:
        blur(5px);

    opacity:
        0;

    pointer-events:
        none;

    transition:
        opacity 0.35s ease;
}


.message-overlay.active {

    opacity:
        1;

    pointer-events:
        auto;
}


.message {

    position:
        fixed;

    left:
        50%;

    top:
        50%;

    width:
        min(90%, 520px);

    padding:
        40px 35px;

    transform:
        translate(
            -50%,
            -50%
        )
        scale(0.90);

    background:

        linear-gradient(
            145deg,
            rgba(7,35,53,0.98),
            rgba(2,18,30,0.98)
        );

    border:
        1px solid
        rgba(200,230,255,0.15);

    border-radius:
        24px;

    box-shadow:
        0 30px 100px
        rgba(0,0,0,0.75);

    text-align:
        center;

    opacity:
        0;

    transition:
        transform 0.35s ease,
        opacity 0.35s ease;
}


.message-overlay.active
.message {

    opacity:
        1;

    transform:
        translate(
            -50%,
            -50%
        )
        scale(1);
}


.message-number {

    font-size:
        11px;

    letter-spacing:
        4px;

    opacity:
        0.55;

    margin-bottom:
        25px;
}


.message-text {

    font-size:
        22px;

    line-height:
        1.6;

    font-style:
        italic;

    margin-bottom:
        25px;
}


.message-location {

    font-size:
        13px;

    opacity:
        0.55;
}


.close {

    margin-top:
        28px;

    padding:
        11px 28px;

    border:
        1px solid
        rgba(215,235,255,0.35);

    background:
        transparent;

    color:
        white;

    border-radius:
        30px;

    cursor:
        pointer;
}


.close:hover {

    background:
        rgba(200,230,255,0.10);
}


/* =========================================================
   MAKE YOUR RIPPLE
========================================================= */

.make-ripple {

    position:
        fixed;

    right:
        25px;

    bottom:
        25px;

    z-index:
        1500;

    padding:
        15px 25px;

    border:
        none;

    border-radius:
        50px;

    background:
        rgba(225,240,255,0.96);

    color:
        #06253a;

    font-weight:
        bold;

    cursor:
        pointer;

    box-shadow:
        0 10px 35px
        rgba(0,0,0,0.45);

    transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
}


.make-ripple:hover {

    transform:
        translateY(-4px);

    box-shadow:
        0 14px 40px
        rgba(0,0,0,0.55);
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px) {

    .header {

        padding:
            20px 15px;
    }

    .logo {

        font-size:
            10px;

        letter-spacing:
            3px;
    }

    h1 {

        font-size:
            34px;
    }

    .subtitle {

        font-size:
            14px;
    }

    .ripple {

        width:
            75px;

        height:
            75px;
    }

    .message {

        padding:
            30px 24px;
    }

    .message-text {

        font-size:
            19px;
    }

    .make-ripple {

        right:
            15px;

        bottom:
            15px;

        padding:
            13px 20px;
    }

}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="header"
        id="header">

    <div class="logo">
        MAKE THE RIPPLE
    </div>

    <h1>
        The Infinite Pond
    </h1>

    <div class="subtitle">
        Every ripple starts with one person.
    </div>

    <div class="ripple-count">
        🌊 100 RIPPLE MAKERS
    </div>

</header>


<!-- =====================================================
     POND
===================================================== -->

<main class="pond"
      id="pond">


    <div class="moon-glow">
    </div>


    <div class="moon-reflection">
    </div>


    <div class="water-waves">
    </div>


    <div class="water-lines">
    </div>


    <div class="water-depth">
    </div>


</main>


<!-- =====================================================
     MESSAGE
===================================================== -->

<div class="message-overlay"
     id="messageOverlay">


    <div class="message">


        <div class="message-number"
             id="messageNumber">
        </div>


        <div class="message-text"
             id="messageText">
        </div>


        <div class="message-location"
             id="messageLocation">
        </div>


        <button class="close"
                onclick="closeMessage()">

            Close Ripple

        </button>


    </div>

</div>


<!-- =====================================================
     MAKE YOUR RIPPLE
===================================================== -->

<button class="make-ripple"
        onclick="makeRipple()">

    🌊 Make Your Ripple

</button>


<script>


/* =========================================================
   RIPPLE DATA
========================================================= */

const messages = [

    {
        text:
        "Today I checked in on someone who seemed like they needed someone to talk to.",

        location:
        "Kitchener, Ontario"
    },

    {
        text:
        "Asking for help doesn't make you weak.",

        location:
        "Waterloo, Ontario"
    },

    {
        text:
        "Today I chose kindness.",

        location:
        "Cambridge, Ontario"
    },

    {
        text:
        "I reminded someone that they aren't alone.",

        location:
        "Guelph, Ontario"
    },

    {
        text:
        "Today I took a moment to look after myself.",

        location:
        "Toronto, Ontario"
    },

    {
        text:
        "Sometimes the smallest act of kindness can make the biggest difference.",

        location:
        "Hamilton, Ontario"
    },

    {
        text:
        "I asked someone how they were really doing.",

        location:
        "London, Ontario"
    },

    {
        text:
        "Today I decided that reaching out was worth it.",

        location:
        "Ottawa, Ontario"
    },

    {
        text:
        "You never know what someone is carrying. Be kind.",

        location:
        "Windsor, Ontario"
    },

    {
        text:
        "I don't have to solve everything. Sometimes listening is enough.",

        location:
        "Kingston, Ontario"
    }

];


/* =========================================================
   CREATE RIPPLE
========================================================= */

const pond =
    document.getElementById(
        "pond"
    );

let rippleNumber = 0;


function createRipple() {

    rippleNumber++;


    const ripple =
        document.createElement(
            "div"
        );


    ripple.className =
        "ripple";


    const dot =
        document.createElement(
            "div"
        );


    dot.className =
        "ripple-dot";


    ripple.appendChild(
        dot
    );


    const data =
        messages[
            Math.floor(
                Math.random()
                *
                messages.length
            )
        ];


    ripple.dataset.text =
        data.text;


    ripple.dataset.location =
        data.location;


    ripple.dataset.number =
        rippleNumber;


    ripple.style.left =
        (
            5 +
            Math.random() * 90
        )
        + "%";


    ripple.style.top =
        (
            150 +
            Math.random() * 11700
        )
        + "px";


    ripple.addEventListener(
        "click",
        function(event) {

            event.stopPropagation();


            showMessage(

                ripple.dataset.number,

                ripple.dataset.text,

                ripple.dataset.location

            );

        }
    );


    pond.appendChild(
        ripple
    );

}


/* =========================================================
   INITIAL RIPPLE FIELD
========================================================= */

for (
    let i = 0;
    i < 120;
    i++
) {

    createRipple();

}


/* =========================================================
   SHOW MESSAGE
========================================================= */

function showMessage(
    number,
    text,
    location
) {

    document.getElementById(
        "messageNumber"
    ).innerText =
        "RIPPLE #" +
        number;


    document.getElementById(
        "messageText"
    ).innerText =
        '"' +
        text +
        '"';


    document.getElementById(
        "messageLocation"
    ).innerText =
        "— " +
        location;


    document.getElementById(
        "messageOverlay"
    ).classList.add(
        "active"
    );

}


function closeMessage() {

    document.getElementById(
        "messageOverlay"
    ).classList.remove(
        "active"
    );

}


/* =========================================================
   CLOSE MESSAGE OUTSIDE
========================================================= */

document
    .getElementById(
        "messageOverlay"
    )
    .addEventListener(
        "click",
        function(event) {

            if (
                event.target === this
            ) {

                closeMessage();

            }

        }
    );


/* =========================================================
   MAKE YOUR RIPPLE
========================================================= */

function makeRipple() {

    alert(
        "Your Ripple submission form will be connected here next."
    );

}


/* =========================================================
   HEADER FADE
========================================================= */

let lastScroll =
    window.scrollY;


window.addEventListener(
    "scroll",
    function() {

        const currentScroll =
            window.scrollY;


        const header =
            document.getElementById(
                "header"
            );


        if (
            currentScroll > 500 &&
            currentScroll > lastScroll
        ) {

            header.classList.add(
                "hidden"
            );

        }

        else {

            header.classList.remove(
                "hidden"
            );

        }


        lastScroll =
            currentScroll;

    }
);


</script>


</body>

</html>
