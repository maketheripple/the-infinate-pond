<!-- =========================================================
     THE INFINITE POND
     VERSION 9.0 — MAKE THE RIPPLE BRANDING
     ========================================================= -->

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>The Infinite Pond | Make the Ripple</title>


<style>

    html,
    body {

        margin: 0;
        padding: 0;

        width: 100%;
        height: 100%;

        overflow: hidden;

        background: #000;

        font-family:
            Arial,
            Helvetica,
            sans-serif;

    }


    body {

        position: relative;

        color: white;

    }


    /* =========================================================
       WATER
       ========================================================= */

    #waterCanvas {

        position: fixed;

        top: 0;
        left: 0;

        width: 100%;
        height: 100%;

        display: block;

        z-index: 0;

    }


    /* =========================================================
       MOONLIGHT
       ========================================================= */

    .moonGlow {

        position: fixed;

        top: 12%;
        left: 50%;

        width: 180px;
        height: 180px;

        transform:
            translateX(-50%);

        border-radius: 50%;

        background:
            radial-gradient(
                circle,
                rgba(210, 235, 255, 0.20) 0%,
                rgba(170, 215, 255, 0.08) 35%,
                rgba(100, 160, 220, 0.02) 60%,
                transparent 75%
            );

        pointer-events: none;

        z-index: 1;

    }


    /* =========================================================
       MAKE THE RIPPLE BRAND
       ========================================================= */

    .brand {

        position: fixed;

        top: 28px;
        left: 35px;

        z-index: 5;

        display: flex;

        align-items: center;

        gap: 12px;

        pointer-events: none;

    }


    .brand-logo {

        width: 170px;

        height: auto;

        display: block;

        filter:
            drop-shadow(
                0 0 12px
                rgba(120, 210, 255, 0.35)
            );

    }


    /* =========================================================
       MAIN TITLE
       ========================================================= */

    h1 {

        position: fixed;

        top: 40%;

        left: 50%;

        transform:
            translate(
                -50%,
                -50%
            );

        z-index: 5;

        width: 90%;

        margin: 0;

        font-size: clamp(
            36px,
            7vw,
            90px
        );

        text-align: center;

        font-weight: 300;

        letter-spacing: 5px;

        line-height: 1.05;

        text-shadow:
            0 2px 20px
            rgba(0, 0, 0, 0.45);

        pointer-events: none;

    }


    /* =========================================================
       SUBTITLE
       ========================================================= */

    .subtitle {

        position: fixed;

        top: calc(40% + 62px);

        left: 50%;

        transform:
            translateX(-50%);

        z-index: 5;

        width: 90%;

        text-align: center;

        font-size: clamp(
            15px,
            2vw,
            19px
        );

        letter-spacing: 1px;

        opacity: 0.85;

        text-shadow:
            0 2px 10px
            rgba(0, 0, 0, 0.6);

        pointer-events: none;

    }


    /* =========================================================
       RIPPLE MAKER COUNT
       ========================================================= */

    .ripple-count {

        position: fixed;

        top: 32px;
        right: 35px;

        z-index: 5;

        padding:
            9px
            15px;

        border-radius: 20px;

        background:
            rgba(
                0,
                15,
                30,
                0.30
            );

        border:
            1px solid
            rgba(
                180,
                220,
                255,
                0.20
            );

        backdrop-filter:
            blur(6px);

        font-size: 14px;

        letter-spacing: 1px;

        opacity: 0.9;

        box-shadow:
            0 4px 20px
            rgba(0, 0, 0, 0.20);

    }


    /* =========================================================
       RIPPLE MESSAGE
       ========================================================= */

    .message {

        position: fixed;

        left: 50%;
        bottom: 40px;

        transform:
            translateX(-50%);

        z-index: 10;

        width: min(
            90%,
            500px
        );

        padding: 25px;

        box-sizing: border-box;

        text-align: center;

        border-radius: 16px;

        background:
            rgba(
                0,
                15,
                30,
                0.82
            );

        border:
            1px solid
            rgba(
                180,
                220,
                255,
                0.25
            );

        backdrop-filter:
            blur(10px);

        display: none;

        box-shadow:
            0 10px 40px
            rgba(0, 0, 0, 0.35);

    }


    .message-number {

        font-size: 14px;

        opacity: 0.6;

        margin-bottom: 10px;

        letter-spacing: 1px;

    }


    .message-text {

        font-size: 22px;

        line-height: 1.4;

        margin-bottom: 10px;

    }


    .message-location {

        font-size: 14px;

        opacity: 0.65;

        margin-bottom: 20px;

    }


    .close {

        padding:
            10px
            20px;

        border:
            1px solid
            rgba(
                255,
                255,
                255,
                0.15
            );

        border-radius: 20px;

        cursor: pointer;

        background:
            rgba(
                255,
                255,
                255,
                0.15
            );

        color: white;

        transition:
            background 0.2s ease,
            transform 0.2s ease;

    }


    .close:hover {

        background:
            rgba(
                255,
                255,
                255,
                0.25
            );

        transform:
            translateY(-1px);

    }


    /* =========================================================
       MAKE YOUR RIPPLE BUTTON
       ========================================================= */

    .make-ripple {

        position: fixed;

        bottom: 25px;
        right: 30px;

        z-index: 5;

        padding:
            13px
            22px;

        border-radius: 28px;

        background:
            rgba(
                0,
                20,
                35,
                0.55
            );

        border:
            1px solid
            rgba(
                180,
                230,
                255,
                0.35
            );

        color: white;

        font-size: 15px;

        font-weight: 500;

        letter-spacing: 0.5px;

        cursor: pointer;

        backdrop-filter:
            blur(8px);

        box-shadow:
            0 4px 20px
            rgba(
                0,
                0,
                0,
                0.25
            );

        transition:
            background 0.25s ease,
            border-color 0.25s ease,
            transform 0.25s ease,
            box-shadow 0.25s ease;

    }


    .make-ripple:hover {

        background:
            rgba(
                30,
                80,
                110,
                0.65
            );

        border-color:
            rgba(
                200,
                240,
                255,
                0.55
            );

        transform:
            translateY(-2px);

        box-shadow:
            0 6px 25px
            rgba(
                0,
                0,
                0,
                0.35
            );

    }


    /* =========================================================
       MOBILE
       ========================================================= */

    @media (
        max-width: 600px
    ) {

        .brand {

            top: 20px;
            left: 20px;

        }


        .brand-logo {

            width: 135px;

        }


        .ripple-count {

            top: 20px;
            right: 20px;

            font-size: 12px;

            padding:
                8px
                11px;

        }


        h1 {

            top: 39%;

            font-size:
                clamp(
                    32px,
                    11vw,
                    60px
                );

            letter-spacing: 3px;

        }


        .subtitle {

            top: calc(39% + 58px);

            font-size: 14px;

        }


        .make-ripple {

            right: 50%;

            bottom: 20px;

            transform:
                translateX(50%);

            white-space: nowrap;

        }


        .make-ripple:hover {

            transform:
                translateX(50%)
                translateY(-2px);

        }


        .message {

            bottom: 85px;

            width: 92%;

        }

    }

</style>


<!-- =========================================================
     MAKE THE RIPPLE BRAND
     ========================================================= -->

<div class="brand">

    <img
        class="brand-logo"
        src="images/Make%20the%20Ripple%20Large%20Logo.png"
        alt="Make the Ripple"
    >

</div>


<!-- =========================================================
     MAIN EXPERIENCE
     ========================================================= -->

<h1>
    The Infinite Pond
</h1>


<div class="subtitle">
    Every ripple starts with one person.
</div>


<div class="ripple-count">
    🌊 100 RIPPLE MAKERS
</div>


<!-- =========================================================
     WATER
     ========================================================= -->

<canvas id="waterCanvas"></canvas>


<div class="moonGlow"></div>


<!-- =========================================================
     RIPPLE MESSAGE
     ========================================================= -->

<div class="message">

    <div
        class="message-number"
        id="messageNumber">
    </div>


    <div
        class="message-text"
        id="messageText">
    </div>


    <div
        class="message-location"
        id="messageLocation">
    </div>


    <button
        class="close"
        onclick="closeMessage()">

        Close Ripple

    </button>

</div>


<!-- =========================================================
     MAKE YOUR RIPPLE
     ========================================================= -->

<button
    class="make-ripple"
    onclick="makeRipple()">

    🌊 Make Your Ripple

</button>


<!-- =========================================================
     WATER ENGINE
     ========================================================= -->

<script src="water.js"></script>


<!-- =========================================================
     PAGE CONTROLS
     ========================================================= -->

<script>

    function closeMessage() {

        const message =
            document.querySelector(
                ".message"
            );

        if (message) {

            message.style.display =
                "none";

        }

    }


    function makeRipple() {

        const x =
            window.innerWidth / 2;

        const y =
            window.innerHeight / 2;

        if (
            typeof createRipple ===
            "function"
        ) {

            createRipple(
                x,
                y
            );

        }

    }

</script>
